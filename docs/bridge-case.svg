<title id="title">The nearest car is not always the fastest</title><desc id="desc">A 1.03 kilometre car takes 16 minutes due to a one-way bridge detour. A 1.14 kilometre car takes 4 minutes and is selected. Supplied snapshot routing estimates, not live travel times.</desc>
